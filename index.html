<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévia</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #121212;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 420px;
      background: #1c1c1c;
      border-radius: 18px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 28px;
      box-shadow: 0 0 35px rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }

    .preview-img {
      width: 100%;
      height: 460px;
      object-fit: cover;
      filter: none;
      transition: 0.4s ease;
    }

    .username {
      font-size: 24px;
      margin-top: 18px;
      font-weight: bold;
    }

    .subtext {
      margin: 14px 22px;
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.4em;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg,#ff0055,#ff7b00);
      padding: 14px 22px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 8px 22px rgba(255,0,80,0.4);
    }

    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 28px rgba(255,0,80,0.55);
    }
  </style>

  <!-- META PURCHASE TRACKING -->
  <script>
  (function () {
    const purchaseEventId =
      localStorage.getItem('meta_event_id') ||
      ('purchase_' + Date.now() + '_' + Math.random().toString(36).slice(2));

    if (localStorage.getItem('purchase_sent')) return;
    localStorage.setItem('purchase_sent', '1');

    if (typeof fbq === 'function') {
      fbq('track', 'Purchase', {
        value: 1.00,
        currency: 'USD'
      }, { eventID: purchaseEventId });
    }

    fetch('/api/meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: 'Purchase',
        event_id: purchaseEventId,
        url: window.location.href
      })
    });
  })();
  </script>
  <!-- END META PURCHASE -->

</head>

<body>
  <div class="container">
    <video class="preview-img" src="IMG_0041.mp4" autoplay muted loop playsinline></video>

    <div class="username">dayanezinhax</div>

    <div class="subtext">
      👇 O que você procura está aqui<br>
      (Se não abrir, clique nos 3 pontinhos acima e abrir no navegador)
    </div>

    <a href="https://t.me/DayanePRIVACYbot" class="btn">Prévia da Dayane 👀</a>
  </div>
</body>
</html>
